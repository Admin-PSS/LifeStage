name: Deploy LifeStageAPI to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
AZURE_WEBAPP_NAME: your-app-name    # Replace with your Azure Web App name
  AZURE_WEBAPP_PACKAGE_PATH: '.'
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore src/LifeStageAPI/LifeStageAPI.csproj
    
    - name: Build
      run: dotnet build src/LifeStageAPI/LifeStageAPI.csproj --configuration Release --no-restore

    - name: Publish
   run: dotnet publish src/LifeStageAPI/LifeStageAPI.csproj --configuration Release --no-build --output ./publish
    
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
     app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish
